<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Moved — AI-Native Enterprise Operating Model</title>
  <style>
    :root {
      --bg: #FAF9F7;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --muted: #5C5C6D;
      --accent: #C75B39;
      --accent-hover: #A84A2E;
      --border: #E8E6E1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: 56px 44px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(26,26,46,0.08);
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 24px;
      border-radius: 50%;
      background: #FDF0EC;
      color: var(--accent);
      font-size: 26px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
    }
    p {
      margin: 0 auto 30px;
      max-width: 540px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }
    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { background: var(--accent-hover); }
    a:focus-visible { outline: 3px solid #E8C4B8; outline-offset: 3px; }
    .url {
      margin-top: 18px;
      font-size: .85rem;
      color: #8A8A9A;
      overflow-wrap: anywhere;
    }
    @media (max-width: 520px) {
      main { padding: 42px 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1>This page has moved.</h1>
    <p>Please use the new AI-Native Enterprise Operating Model URL.</p>
    <a href="/ainativesafe/">Open the AI-Native Enterprise Operating Model</a>
    <!-- div class="url">edwinbhasker.github.io/ainativesafe/</div -->
  </main>
</body>
</html>
